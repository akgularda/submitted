<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kampüs Ekranı | SubmitTED 2026</title>
  <meta name="description" content="SubmitTED Kariyer Zirvesi 2026 havalimanı bilgi ekranı tarzında karanlık canlı Zone ve şirket doluluk panosu.">
  <link rel="icon" type="image/svg+xml" href="assets/submitted-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css?v=20261124fids">
</head>
<body class="fids-body">

  <!-- Minimalist Dark Airport Header -->
  <header class="fids-header">
    <div class="fids-wrap fids-header-inner">
      <div class="fids-brand">
        <a href="index.html" class="fids-logo-link" aria-label="SubmitTED Ana Sayfa">
          <img src="assets/submitted-logo-white.svg" alt="SubmitTED" class="fids-logo">
        </a>
        <span class="fids-sep" aria-hidden="true">/</span>
        <span class="fids-board-name" id="fids-board-title">KAMPÜS DOLULUK PANOSU</span>
      </div>

      <div class="fids-header-meta">
        <div class="fids-stat">
          <span>İÇERİDE</span>
          <strong id="dash-total-inside">615 / 953</strong>
        </div>
        <div class="fids-clock" id="dash-clock">--:--:--</div>
        <div class="fids-tools" id="dash-controls-bar">
          <button type="button" class="fids-tool-btn" id="dash-dispatch-toggle" aria-expanded="false">Anons</button>
          <button type="button" class="fids-tool-btn" id="dash-fullscreen-btn">Tam Ekran</button>
          <a href="index.html" class="fids-tool-btn">Site</a>
        </div>
      </div>
    </div>

    <!-- Subtle Screen Switcher Strip -->
    <div class="fids-subnav">
      <div class="fids-wrap fids-subnav-inner">
        <div class="fids-tabs" id="dash-zone-tabs" role="tablist" aria-label="Ekran Modu"></div>
        <span class="fids-balance-note" id="dash-balance-text"></span>
      </div>
    </div>
  </header>

  <!-- Collapsible Organizer Dispatch Bar (Hidden by default) -->
  <section class="fids-dispatch" id="dash-dispatch-panel" hidden>
    <div class="fids-wrap fids-dispatch-inner">
      <div class="fids-preset-row" id="dispatch-preset-buttons"></div>
      <form id="custom-dispatch-form" class="fids-dispatch-form">
        <input type="text" id="custom-speaker" placeholder="Kurum (ör. ASELSAN)" required>
        <input type="text" id="custom-title" placeholder="Çağrı metni (ör. Konuşma 10 dk içinde başlıyor)" required>
        <select id="custom-target-zone" aria-label="Hedef Zone"></select>
        <button type="submit" class="fids-tool-btn fids-tool-accent">Yayınla</button>
      </form>
    </div>
  </section>

  <!-- Clean Airport Departure-Board Table (Zero QR Codes) -->
  <main class="fids-main">
    <div class="fids-wrap fids-board-container">
      <div class="fids-board-frame">
        <div class="fids-board-head" id="fids-table-head">
          <span>BÖLGE / ALAN</span>
          <span>KONUM</span>
          <span>DOLULUK</span>
          <span>ORAN</span>
          <span>DURUM</span>
        </div>

        <div class="fids-rows" id="fids-rows" role="list"></div>
      </div>

      <div class="fids-board-hint" id="fids-board-hint">
        Şirket ve masa yoğunluklarını görmek için listeden bir Zone satırına tıklayabilirsiniz.
      </div>
    </div>
  </main>

  <!-- Subtle Bottom Airport Gate Call / Soft-Flashing Announcement Bar -->
  <footer class="fids-bottom-call" id="fids-bottom-call" aria-live="polite">
    <div class="fids-wrap fids-call-inner">
      <button type="button" class="fids-call-main" id="routing-focus-btn">
        <span class="fids-flash-indicator" id="routing-badge">ANONS</span>
        <span class="fids-flash-text" id="routing-copy">
          ASELSAN KONUŞMASI 10 DK İÇİNDE TECH&amp;INNOVATION ZONE (D BLOK)’DA BAŞLIYOR
        </span>
      </button>
      <a href="https://radiotedu.com/technology" target="_blank" rel="noopener noreferrer" class="fids-credit">
        <span>Made with love by RadioTEDU Technologies</span>
      </a>
    </div>
  </footer>

  <script src="telemetry.js?v=20261124a"></script>
  <script src="dashboard.js?v=20261124fids"></script>
</body>
</html>
